c" font-weight="600" text-anchor="start">钢琴</text><line x1="544" y1="155" x2="544" y2="193" stroke="#d8dcd5" stroke-width="1" /><line x1="618" y1="155" x2="618" y2="193" stroke="#d8dcd5" stroke-width="1" /><line x1="692" y1="155" x2="692" y2="193" stroke="#d8dcd5" stroke-width="1" /><line x1="766" y1="155" x2="766" y2="193" stroke="#d8dcd5" stroke-width="1" /><line x1="840" y1="155" x2="840" y2="193" stroke="#d8dcd5" stroke-width="1" /><rect x="544" y="200" width="298" height="38" rx="4" fill="#f2f4f0" stroke="none" /><text x="476" y="225" font-size="17" fill="#167d8d" font-weight="600" text-anchor="start">贝斯</text><line x1="544" y1="200" x2="544" y2="238" stroke="#d8dcd5" stroke-width="1" /><line x1="618" y1="200" x2="618" y2="238" stroke="#d8dcd5" stroke-width="1" /><line x1="692" y1="200" x2="692" y2="238" stroke="#d8dcd5" stroke-width="1" /><line x1="766" y1="200" x2="766" y2="238" stroke="#d8dcd5" stroke-width="1" /><line x1="840" y1="200" x2="840" y2="238" stroke="#d8dcd5" stroke-width="1" /><rect x="544" y="245" width="298" height="38" rx="4" fill="#f2f4f0" stroke="none" /><text x="476" y="270" font-size="17" fill="#617db0" font-weight="600" text-anchor="start">长笛</text><line x1="544" y1="245" x2="544" y2="283" stroke="#d8dcd5" stroke-width="1" /><line x1="618" y1="245" x2="618" y2="283" stroke="#d8dcd5" stroke-width="1" /><line x1="692" y1="245" x2="692" y2="283" stroke="#d8dcd5" stroke-width="1" /><line x1="766" y1="245" x2="766" y2="283" stroke="#d8dcd5" stroke-width="1" /><line x1="840" y1="245" x2="840" y2="283" stroke="#d8dcd5" stroke-width="1" /><rect x="548" y="163" width="100" height="10" rx="3" fill="#cc562c" stroke="none" /><rect x="608" y="178" width="84" height="10" rx="3" fill="#cc562c" stroke="none" /><rect x="719" y="157" width="116" height="10" rx="3" fill="#cc562c" stroke="none" /><rect x="548" y="214" width="176" height="10" rx="3" fill="#167d8d" stroke="none" /><rect x="751" y="218" width="84" height="10" rx="3" fill="#167d8d" stroke="none