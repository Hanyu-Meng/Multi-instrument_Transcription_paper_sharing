<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Three modelling routes from sound to notes</title><desc id="desc">Three simplified routes: NMF or templates produce time-varying activations, then notes; frame-wise neural networks predict onset and frame grids, then assemble notes; sequence-to-sequence models use an audio encoder and event decoder to produce MIDI events.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#18282c"/></marker></defs>
<rect width="900" height="430" rx="18" fill="#f5f2eb"/>
