<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">三条建模路线：如何把声音变成音符</title><desc id="desc">三条简化路线：NMF 或模板分解得到随时间变化的激活，然后解码为音符；逐帧神经网络预测起音和持续状态，然后组合为音符；序列到序列模型通过音频编码器和事件解码器生成 MIDI 事件。</desc>
