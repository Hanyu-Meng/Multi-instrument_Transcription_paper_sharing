rker-end="url(#arrow)"/><text x="50" y="125" font-size="19" fill="#cc562c" font-weight="600" text-anchor="start">NMF / templates</text><text x="50" y="152" font-size="16" fill="#637174" font-weight="400" text-anchor="start">Factorise spectra</text><text x="274" y="125" font-size="18" fill="#18282c" font-weight="600" text-anchor="start">Pitch activations over time</text><rect x="275" y="149" width="18" height="7" rx="2" fill="#cc562c" stroke="none" /><rect x="302" y="139" width="18" height="17" rx="2" fill="#cc562c" stroke="none" /><rect x="329" y="146" width="18" height="10" rx="2" fill="#cc562c" stroke="none" /><rect x="356" y="136" width="18" height="20" rx="2" fill="#cc562c" stroke="none" /><rect x="383" y="134" width="18" height="22" rx="2" fill="#cc562c" stroke="none" /><rect x="410" y="148" width="18" height="8" rx="2" fill="#cc562c" stroke="none" /><rect x="437" y="151" width="18" height="5" rx="2" fill="#cc562c" stroke="none" /><rect x="464" y="141" width="18" height="15" rx="2" fill="#cc562c" stroke="none" /><rect x="491" y="135" width="18" height="21" rx="2" fill="#cc562c" stroke="none" /><rect x="518" y="147" width="18" height="9" rx="2" fill="#cc562c" stroke="none" /><rect x="545" y="143" width="18" height="13" rx="2" fill="#cc562c" stroke="none" /><rect x="572" y="137" width="18" height="19" rx="2" fill="#cc562c" stroke="none" /><text x="780" y="125" font-size="19" fill="#18282c" font-weight="600" text-anchor="middle">Note events</text><text x="780" y="152" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">Threshold / decode</text><text x="50" y="219" font-size="18" fill="#167d8d" font-weight="600" text-anchor="start">Frame-wise neural</text><text x="50" y="246" font-size="16" fill="#637174" font-weight="400" text-anchor="start">Predict each frame</text><text x="274" y="218" font-size="18" fill="#18282c" font-weight="600" text-anchor="start">Onset / frame grids</text><rect x="275" y="229" width="20" height="10" rx="1" fill="#167d8d" s