<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Why it is hard: different notes share frequency components</title><desc id="desc">C3 harmonics occur at integer multiples of its fundamental. C4 is one octave higher, so its fundamental is twice that of C3. All illustrated C4 harmonics overlap the even harmonics of C3. This is a conceptual spectrum, not measured data.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#18282c"/></marker></defs>
<rect width="900" height="430" rx="18" fill="#f5f2eb"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="34" y="43" font-size="24" fill="#18282c" font-weight="650" text-anchor="start">Why it is hard: different notes share frequency components</text><text x="34" y="74" font-size="17" fill="#637174" font-weight="400" text-anchor="start">The second harmonic of C3 coincides with the fundamental of C4.</text><rect x="282" y="94" width="24" height="230" rx="6" fill="#e9ddd0" stroke="none" /><rect x="542" y="94" width="24" height="230" rx="6" fill="#e9ddd0" stroke="none" /><rect x="802" y="94" width="24" height="230" rx="6" fill="#e9ddd0" stroke="none" /><text x="34" y="122" font-size="20" fill="#cc562c" font-weight="600" text-anchor="start">Note C3</text><text x="34" y="147" font-size="16" fill="#637174" font-weight="400" text-anchor="start">One octave lower</text><text x="34" y="240" font-size="20" fill="#167d8d" font-weight="600" text-anchor="start">Note C4</text><text x="34" y="265" font-size="16" fill="#637174" font-weight="400" text-anchor="start">One octave higher</text><line x1="151" y1="198" x2="845" y2="198" stroke="#18282c" stroke-width="1.4" /><line x1="151" y1="316" x2="845" y2="316" stroke="#18282c" stroke-width="1.4" /><line x1="164" y1="198" x2="164" y2="120" stroke="#cc562c" stroke-width="4" /><circle cx="164" cy="120" r="4" fill="#cc562c"/><line x1="294" y1="198" x2="294" y2="141" stroke="#cc562c" stroke-width="4" /><circle cx="294" cy="141" r="4" fill="#cc562c"/><line x1="424" y1="198" x2="424" y2="158" stroke="#cc562c" stroke-width="4" /><circle cx="424" cy="158" r="4" fill="#cc562c"/><line x1="554" y1="198" x2="554" y2="165" stroke="#cc562c" stroke-width="4" /><circle cx="554" cy="165" r="4" fill="#cc562c"/><line x1="684" y1="198" x2="684" y2="172" stroke="#cc562c" stroke-width="4" /><circle cx="684" cy="172" r="4" fill="#cc562c"/><line x1="814" y1="198" x2="814" y2="177" stroke="#cc562c" stroke-width="4" /><circle cx="814" cy="177" r="4" fill="#cc562c"/><line x1="294" y1="316" x2="294" y2="240" stroke="#167d8d" stroke-width="4" /><circle cx="294" cy="240" r="4" fill="#167d8d"/><line x1="554" y1="316" x2="554" y2="265" stroke="#167d8d" stroke-width="4" /><circle cx="554" cy="265" r="4" fill="#167d8d"/><line x1="814" y1="316" x2="814" y2="284" stroke="#167d8d" stroke-width="4" /><circle cx="814" cy="284" r="4" fill="#167d8d"/><text x="170" y="108" font-size="16" fill="#cc562c" font-weight="400" text-anchor="start">Fundamental</text><text x="365" y="114" font-size="16" fill="#cc562c" font-weight="400" text-anchor="start">Harmonics</text><line x1="378" y1="120" x2="420" y2="151" stroke="#cc562c" stroke-width="1.4" /><text x="300" y="227" font-size="16" fill="#167d8d" font-weight="400" text-anchor="start">Fundamental</text><text x="613" y="235" font-size="17" fill="#18282c" font-weight="600" text-anchor="start">Shared frequencies</text><line x1="735" y1="241" x2="807" y2="278" stroke="#18282c" stroke-width="1.2" /><text x="164" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">1×f₀</text><text x="294" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">2×f₀</text><text x="424" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">3×f₀</text><text x="554" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">4×f₀</text><text x="684" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">5×f₀</text><text x="814" y="345" font-size="16" fill="#637174" font-weight="400" text-anchor="middle">6×f₀</text><text x="34" y="371" font-size="16" fill="#637174" font-weight="400" text-anchor="start">f₀ ≈ 130.8 Hz · horizontal axis: frequency · peak heights are schematic.</text><line x1="34" y1="385" x2="866" y2="385" stroke="#d8dcd5" stroke-width="1" /><text x="34" y="411" font-size="16" fill="#637174" font-weight="400" text-anchor="start">Original conceptual illustration · not measured data</text></g></svg>